<!DOCTYPE html>
<html lang="en">
<head>
    <title>Upload Excel</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/upload_excel.css' %}">

</head>
<body>
    <h2>Upload Excel File</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
</body>
</html>
