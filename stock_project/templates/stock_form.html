<!DOCTYPE html>
<html>
<head>
    <title>Stock Form</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/stock_form.css' %}">

</head>
<body>
    <h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Stock Item</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            {% for field in form %}
                <div>
                    {{ field.label_tag }} {{ field }}
                </div>
            {% endfor %}
        </div>
<!--        {{ form.as_p }}-->
        <button type="submit">Save</button>
    </form>
</body>
</html>
